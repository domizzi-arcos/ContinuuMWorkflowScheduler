services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-insight:
    image: redislabs/redisinsight:latest
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./logs:/root/logs
      - ./results:/root/results
      - "./globus dataset:/root/globus dataset"
    environment:
      CONFIG_PATH: /app/config.yaml
      # Override the values in config.yaml here, or leave them out to use defaults.
      EXPERIMENT_DURATION_SECONDS: "180"
      EXPERIMENT_PROGRESS_LOG_SECONDS: "10"
      EXPERIMENT_LOG_DIR: /root/logs

volumes:
  redis_data:
